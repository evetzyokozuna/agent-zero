<html>
  <head>
    <title>Speech</title>
  </head>

  <body>
    <div x-data="{
      el11Server: false,
      grokVoiceServer: false,
      init() {
        this.el11Server = localStorage.getItem('speech.el11Server') === 'true';
        this.grokVoiceServer = localStorage.getItem('speech.grokVoiceServer') === 'true';
        this.$watch('el11Server', value => localStorage.setItem('speech.el11Server', value));
        this.$watch('grokVoiceServer', value => {
          localStorage.setItem('speech.grokVoiceServer', value);
          if (value) {
            this.el11Server = false;
            localStorage.setItem('speech.el11Server', false);
            if ($store.settings?.settings) {
              $store.settings.settings.tts_kokoro = false;
            }
          }
        });
      },
      toggleKokoro(nextValue) {
        if ($store.settings?.settings) {
          $store.settings.settings.tts_kokoro = nextValue;
        }
      }
    }">
      <template x-if="$store.settings.settings">
        <div>
          <div class="section-title">Speech</div>
          <div class="section-description">
            Voice transcription and speech synthesis settings.
          </div>

          <div class="field field-full">
            <div class="field-label">
              <div class="field-title">Microphone device</div>
              <div class="field-description">Select the microphone device to use for speech-to-text.</div>
            </div>
            <div class="field-control">
              <x-component path="/settings/speech/microphone.html"></x-component>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Speech-to-text model size</div>
              <div class="field-description">Select the speech-to-text model size</div>
            </div>
            <div class="field-control">
              <select x-model="$store.settings.settings.stt_model_size">
                <template x-for="option in $store.settings.additional?.stt_models" :key="option.value">
                  <option :value="option.value" :selected="option.value === $store.settings.settings.stt_model_size" x-text="option.label"></option>
                </template>
              </select>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Speech-to-text language code</div>
              <div class="field-description">Language code (e.g. en, fr, it)</div>
            </div>
            <div class="field-control">
              <input type="text" x-model="$store.settings.settings.stt_language" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Microphone silence threshold</div>
              <div class="field-description">Silence detection threshold. Lower values are more sensitive to noise.</div>
            </div>
            <div class="field-control">
              <input type="range" min="0" max="1" step="0.01" x-model.number="$store.settings.settings.stt_silence_threshold" />
              <span class="range-value" x-text="$store.settings.settings.stt_silence_threshold"></span>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Microphone silence duration (ms)</div>
              <div class="field-description">Duration of silence before the system considers speaking to have ended.</div>
            </div>
            <div class="field-control">
              <input type="number" x-model.number="$store.settings.settings.stt_silence_duration" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Microphone waiting timeout (ms)</div>
              <div class="field-description">Duration of silence before the system closes the microphone.</div>
            </div>
            <div class="field-control">
              <input type="number" x-model.number="$store.settings.settings.stt_waiting_timeout" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Enable Kokoro TTS</div>
              <div class="field-description">
                Enable higher quality server-side AI (Kokoro) instead of browser-based text-to-speech.
              </div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input
                  type="checkbox"
                  :checked="$store.settings.settings.tts_kokoro"
                  @change="toggleKokoro($event.target.checked)"
                  :disabled="grokVoiceServer"
                />
                <span class="toggler"></span>
              </label>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Enable ElevenLabs TTS Proxy</div>
              <div class="field-description">
                Route speech output through ElevenLabs proxy endpoint (`/el11_tts`) using profile config from `agents/*/elevenlabs_voice.json`.
              </div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="el11Server" :disabled="grokVoiceServer" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Enable Grok Voice TTS Bridge</div>
              <div class="field-description">
                Route speech output through the standalone Grok Voice bridge endpoint (`/grok_voice_tts`) using server-side `XAI_API_KEY`.
              </div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="grokVoiceServer" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>
          <template x-if="grokVoiceServer">
            <div>
              <div class="field">
                <div class="field-label">
                  <div class="field-title">Grok voice name</div>
                  <div class="field-description">Voice used by Grok Voice API.</div>
                </div>
                <div class="field-control">
                  <select x-model="$store.settings.settings.grok_voice_name">
                    <option value="Ara">Ara</option>
                    <option value="Rex">Rex</option>
                    <option value="Sal">Sal</option>
                    <option value="Eve">Eve</option>
                    <option value="Leo">Leo</option>
                  </select>
                </div>
              </div>

              <div class="field">
                <div class="field-label">
                  <div class="field-title">Grok turn detection</div>
                  <div class="field-description">Keep server VAD for compatibility with future duplex streaming.</div>
                </div>
                <div class="field-control">
                  <select x-model="$store.settings.settings.grok_voice_turn_detection">
                    <option value="server_vad">server_vad</option>
                    <option value="none">none</option>
                  </select>
                </div>
              </div>

              <div class="field">
                <div class="field-label">
                  <div class="field-title">Grok input format</div>
                  <div class="field-description">Realtime input audio format for Grok session config.</div>
                </div>
                <div class="field-control">
                  <select x-model="$store.settings.settings.grok_voice_input_format">
                    <option value="audio/pcm">audio/pcm</option>
                    <option value="audio/pcmu">audio/pcmu</option>
                    <option value="audio/pcma">audio/pcma</option>
                  </select>
                </div>
              </div>

              <div class="field">
                <div class="field-label">
                  <div class="field-title">Grok output format</div>
                  <div class="field-description">Realtime output format; current bridge supports WAV output from PCM stream.</div>
                </div>
                <div class="field-control">
                  <select x-model="$store.settings.settings.grok_voice_output_format">
                    <option value="audio/pcm">audio/pcm</option>
                    <option value="audio/pcmu">audio/pcmu</option>
                    <option value="audio/pcma">audio/pcma</option>
                  </select>
                </div>
              </div>

              <div class="field">
                <div class="field-label">
                  <div class="field-title">Grok input sample rate (Hz)</div>
                  <div class="field-description">Used when Grok input format is `audio/pcm`.</div>
                </div>
                <div class="field-control">
                  <input type="number" min="8000" step="50" x-model.number="$store.settings.settings.grok_voice_input_rate" />
                </div>
              </div>

              <div class="field">
                <div class="field-label">
                  <div class="field-title">Grok output sample rate (Hz)</div>
                  <div class="field-description">Used when Grok output format is `audio/pcm`.</div>
                </div>
                <div class="field-control">
                  <input type="number" min="8000" step="50" x-model.number="$store.settings.settings.grok_voice_output_rate" />
                </div>
              </div>
            </div>
          </template>
        </div>
      </template>
    </div>
  </body>
</html>
