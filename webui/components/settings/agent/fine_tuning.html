<html>
  <head>
    <title>Fine-Tuning</title>
  </head>

  <body>
    <div x-data>
      <template x-if="$store.settings.settings">
        <div data-fine-tuning-root>
          <div class="section-title">Fine-Tuning</div>
          <div class="section-description">
            Structured controls for autonomy and execution knobs. These settings define how the agent behaves under long-running workloads.
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Fine-Tuning apply target</div>
            </div>
            <div class="field-control">
              <select
                x-model="$store.settings.fineTuningApplyTargetValue"
                @change="$store.settings.onFineTuningTargetChanged()">
                <template x-for="opt in $store.settings.fineTuningScopeOptions" :key="opt.value">
                  <option
                    :value="opt.value"
                    :disabled="!!opt.disabled"
                    :title="opt.title || ''"
                    x-text="opt.label"></option>
                </template>
              </select>
            </div>
          </div>

          <div class="subsection-title">Execution Routing Modes (Opt-In)</div>
          <div class="section-description">
            Controls how the agent routes between plain responses and tool execution. Default keeps current Tool-First behavior. Hybrid and Model-First are opt-in and can be tightened with risky-intent tool routing.
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Execution mode</div>
              <div class="field-description">`tool_first` (current), `tool_first_fallback`, `hybrid`, `model_first`. Default is strict backward-compatible Tool-First.</div>
            </div>
            <div class="field-control">
              <select x-model="$store.settings.settings.agent_execution_mode">
                <option value="tool_first">tool_first (current architecture)</option>
                <option value="tool_first_fallback">tool_first_fallback (strict + fallback after N misformats)</option>
                <option value="hybrid">hybrid (plain text or tool call)</option>
                <option value="model_first">model_first (plain text first, tool for execution)</option>
              </select>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Allow plain-text response path</div>
              <div class="field-description">Master gate for accepting non-JSON responses in non-default routing modes. OFF preserves strict JSON-only behavior.</div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="$store.settings.settings.agent_execution_allow_plain_text_response" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Require tool route for risky intents</div>
              <div class="field-description">When enabled, risky/executable intents (writes, deletes, shell commands) must use a JSON tool call even in Hybrid or Model-First mode.</div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="$store.settings.settings.agent_execution_require_tool_for_risky_intents" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Tool-First fallback misformat threshold</div>
              <div class="field-description">For `tool_first_fallback`, plain-text path activates after this many consecutive misformats.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1" step="1" x-model.number="$store.settings.settings.agent_tool_first_fallback_after_misformats" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Risky-intent regex</div>
              <div class="field-description">Regex used to classify requests as executable/risky for enforced tool routing.</div>
            </div>
            <div class="field-control">
              <input type="text" x-model="$store.settings.settings.agent_execution_risky_intent_regex" />
            </div>
          </div>

          <div class="subsection-title">Guard Switches (Adoption Controls)</div>
          <div class="section-description">
            These switches allow gradual adoption of hardening behaviors. Keeping guards off preserves legacy behavior but increases risk of loops, stale retries, and malformed write/read cascades.
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Enable monologue guardrails</div>
              <div class="field-description">Master switch for iteration/runtime/misformat guardrails. OFF increases risk of runaway turns.</div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="$store.settings.settings.agent_guardrails_enabled" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Hard-stop on missing context</div>
              <div class="field-description">Immediately terminates turn on context-id missing failures. OFF may allow repeated invalid retries.</div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="$store.settings.settings.agent_guard_context_hard_stop_enabled" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Repeated tool-action breaker</div>
              <div class="field-description">Blocks repeated identical tool calls in one turn. OFF can reintroduce retry attractor loops.</div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="$store.settings.settings.agent_guard_repeated_tool_action_enabled" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Enable subordinate guardrails</div>
              <div class="field-description">Enforces subordinate depth/calls/runtime limits. OFF may permit costly delegation cascades.</div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="$store.settings.settings.subordinate_guardrails_enabled" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Guard unterminated heredoc</div>
              <div class="field-description">Rejects truncated heredoc terminal writes before shell waiting mode. OFF may hang command sessions.</div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="$store.settings.settings.code_exec_guard_unterminated_heredoc_enabled" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Guard unbalanced shell quotes</div>
              <div class="field-description">Rejects malformed quoted terminal commands early. OFF may send shell into waiting mode.</div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="$store.settings.settings.code_exec_guard_unbalanced_shell_quote_enabled" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Guard repetitive terminal reads</div>
              <div class="field-description">Detects repeated identical read-only terminal commands in short windows. OFF can allow read spam loops.</div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="$store.settings.settings.code_exec_guard_repetitive_terminal_read_enabled" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Guard repetitive file reads</div>
              <div class="field-description">Stops repeated identical file reads once content is already available. OFF can increase no-op file read churn.</div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="$store.settings.settings.code_exec_guard_repetitive_file_read_enabled" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Guard regressive full overwrites</div>
              <div class="field-description">Blocks shrinking append=false rewrite loops and enforces recovery mode. OFF increases risk of destructive rewrite retries.</div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="$store.settings.settings.code_exec_guard_regressive_overwrite_enabled" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Verify write byte counts</div>
              <div class="field-description">Compares expected vs actual bytes after overwrite. OFF may hide partial/truncated writes.</div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="$store.settings.settings.code_exec_guard_write_verify_enabled" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Same-file op ceilings</div>
              <div class="field-description">Caps repeated reads/writes per file in a short window. OFF allows repeated same-path churn.</div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="$store.settings.settings.code_exec_guard_same_file_op_ceiling_enabled" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Guardrail strategy-block mode</div>
              <div class="field-description">After a guardrail hit, blocks same strategy class for that path. OFF may keep retrying equivalent failing strategy.</div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="$store.settings.settings.code_exec_guard_strategy_block_enabled" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Direct cat-to-file-read routing</div>
              <div class="field-description">Routes simple `cat /path` to deterministic file-read runtime. OFF keeps shell cat behavior.</div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="$store.settings.settings.code_exec_guard_simple_cat_direct_read_enabled" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>

          <div class="subsection-title">Resilience Policy Controls</div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Split retry policy by error class</div>
              <div class="field-description">Classifies errors (context/auth/guardrail/transient) and applies class-specific retry behavior.</div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="$store.settings.settings.agent_retry_split_by_error_class_enabled" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Transient error max retries</div>
              <div class="field-description">Retries allowed for transient network/timeout classes when split policy is enabled.</div>
            </div>
            <div class="field-control">
              <input type="number" min="0" step="1" x-model.number="$store.settings.settings.agent_transient_error_max_retries" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Transient retry delay (seconds)</div>
              <div class="field-description">Delay between retries for transient classes.</div>
            </div>
            <div class="field-control">
              <input type="number" min="0" step="1" x-model.number="$store.settings.settings.agent_transient_error_retry_delay_seconds" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Critical error max retries</div>
              <div class="field-description">Fallback retries for unclassified critical errors.</div>
            </div>
            <div class="field-control">
              <input type="number" min="0" step="1" x-model.number="$store.settings.settings.agent_critical_error_max_retries" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Critical retry delay (seconds)</div>
              <div class="field-description">Delay between retries for fallback critical classes.</div>
            </div>
            <div class="field-control">
              <input type="number" min="0" step="1" x-model.number="$store.settings.settings.agent_critical_error_retry_delay_seconds" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Enable degradation auto-abort</div>
              <div class="field-description">Aborts turn early when telemetry thresholds indicate active degradation.</div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="$store.settings.settings.agent_degradation_auto_abort_enabled" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Tool calls per turn ceiling</div>
              <div class="field-description">Auto-abort threshold for total tool calls in one turn.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1" step="1" x-model.number="$store.settings.settings.agent_tool_call_ceiling_per_turn" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Guardrail hits per minute ceiling</div>
              <div class="field-description">Auto-abort threshold for rapid guardrail firing.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1" step="1" x-model.number="$store.settings.settings.agent_guardrail_hits_ceiling_per_minute" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Missing-context errors per turn ceiling</div>
              <div class="field-description">Auto-abort threshold for repeated missing-context failures in one turn.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1" step="1" x-model.number="$store.settings.settings.agent_missing_context_errors_ceiling_per_turn" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Enable tool preflight validator</div>
              <div class="field-description">Validates runtime/path/payload shape before code execution tool calls.</div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="$store.settings.settings.code_exec_tool_preflight_enabled" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Enable deterministic critical-file mode</div>
              <div class="field-description">For critical files, enforces one-read/one-write behavior per window.</div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="$store.settings.settings.code_exec_deterministic_critical_mode_enabled" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Critical-file patterns (comma-separated)</div>
              <div class="field-description">Pattern list for deterministic mode, e.g. `Today.md,*/Today.md,/a0/usr/workdir/today/*`.</div>
            </div>
            <div class="field-control">
              <input type="text" x-model="$store.settings.settings.code_exec_deterministic_critical_patterns" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Deterministic window (seconds)</div>
              <div class="field-description">Window for one-read/one-write enforcement on critical files.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1" step="1" x-model.number="$store.settings.settings.code_exec_deterministic_critical_window_seconds" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Break loop after critical write</div>
              <div class="field-description">Ends current turn after deterministic critical write completes and verifies.</div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="$store.settings.settings.code_exec_deterministic_critical_break_after_write" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>

          <div class="subsection-title">Monologue Guardrails</div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Max iterations per monologue</div>
              <div class="field-description">Hard cap on turns in one monologue cycle.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1" step="1" x-model.number="$store.settings.settings.agent_max_iterations" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Max runtime per monologue (seconds)</div>
              <div class="field-description">Stops a single monologue when runtime exceeds this limit.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1" step="1" x-model.number="$store.settings.settings.agent_max_runtime_seconds" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Max consecutive misformats</div>
              <div class="field-description">Terminates if tool-call formatting fails repeatedly.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1" step="1" x-model.number="$store.settings.settings.agent_max_consecutive_misformats" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Max consecutive repairable errors</div>
              <div class="field-description">Terminates when recoverable failures loop too many times.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1" step="1" x-model.number="$store.settings.settings.agent_max_consecutive_repairable_errors" />
            </div>
          </div>

          <div class="subsection-title">Tool Argument Controls</div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Tool args max chars</div>
              <div class="field-description">Rejects tool payloads larger than this size.</div>
            </div>
            <div class="field-control">
              <input type="number" min="100" step="100" x-model.number="$store.settings.settings.tool_args_max_chars" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Tool args spill threshold chars</div>
              <div class="field-description">Large string fields above this threshold are spilled to temp files.</div>
            </div>
            <div class="field-control">
              <input type="number" min="100" step="100" x-model.number="$store.settings.settings.tool_args_spill_threshold_chars" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Tool args spill directory</div>
              <div class="field-description">Relative path where spilled tool arg files are stored.</div>
            </div>
            <div class="field-control">
              <input type="text" x-model="$store.settings.settings.tool_args_spill_dir" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Tool args auto rewrite</div>
              <div class="field-description">Enable automatic spill/rewrite behavior for oversized fields.</div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="$store.settings.settings.tool_args_autorewrite_enabled" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>

          <div class="subsection-title">Code Execution Reliability</div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">First output timeout (seconds)</div>
              <div class="field-description">How long to wait for the first output chunk from runtime command.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1" step="1" x-model.number="$store.settings.settings.code_exec_first_output_timeout" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Between output timeout (seconds)</div>
              <div class="field-description">How long to wait between output chunks before returning control.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1" step="1" x-model.number="$store.settings.settings.code_exec_between_output_timeout" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Max execution timeout (seconds)</div>
              <div class="field-description">Hard runtime cap for code execution calls.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1" step="1" x-model.number="$store.settings.settings.code_exec_max_exec_timeout" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Dialog timeout (seconds)</div>
              <div class="field-description">Pause early when command appears to wait for interactive input.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1" step="1" x-model.number="$store.settings.settings.code_exec_dialog_timeout" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Output max chars</div>
              <div class="field-description">Truncates very large command output after this size.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1000" step="1000" x-model.number="$store.settings.settings.code_exec_output_max_chars" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Auto-dump large output</div>
              <div class="field-description">Saves full output to file when truncation occurs.</div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="$store.settings.settings.code_exec_auto_dump_large_output" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Code execution dump directory</div>
              <div class="field-description">Relative path where large output dump files are stored.</div>
            </div>
            <div class="field-control">
              <input type="text" x-model="$store.settings.settings.code_exec_dump_dir" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Prefer Python file writes</div>
              <div class="field-description">Blocks terminal heredoc file writes and uses Python file writing policy.</div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="$store.settings.settings.code_exec_prefer_python_file_write" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Code input max chars</div>
              <div class="field-description">Rejects oversized runtime code payloads to avoid truncated writes.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1000" step="1000" x-model.number="$store.settings.settings.code_exec_max_input_chars" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Regressive guard retry threshold</div>
              <div class="field-description">How many guarded append=false retries are allowed before forcing loop break.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1" step="1" x-model.number="$store.settings.settings.code_exec_regressive_guard_retry_threshold" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Regressive guard retry window (seconds)</div>
              <div class="field-description">Retry counter reset window for guarded overwrite attempts.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1" step="1" x-model.number="$store.settings.settings.code_exec_regressive_guard_retry_window_seconds" />
            </div>
          </div>

          <div class="subsection-title">Guard Thresholds and Windows</div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Repeated tool action threshold</div>
              <div class="field-description">Allowed repeat count for identical tool calls. Lower = stricter anti-looping; higher = more retry tolerance.</div>
            </div>
            <div class="field-control">
              <input type="number" min="0" step="1" x-model.number="$store.settings.settings.tool_repeat_signature_threshold" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Repeated tool action window (seconds)</div>
              <div class="field-description">Window used to count repeat tool signatures. Larger windows catch slower loops; smaller windows are less aggressive.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1" step="1" x-model.number="$store.settings.settings.tool_repeat_signature_window_seconds" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Same-file read ceiling</div>
              <div class="field-description">Max repeated reads of same file in window. Lower stops loops sooner; higher permits more retries.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1" step="1" x-model.number="$store.settings.settings.code_exec_same_file_read_ceiling" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Same-file write ceiling</div>
              <div class="field-description">Max repeated writes of same file in window. Lower protects against rewrite churn; higher allows more repair attempts.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1" step="1" x-model.number="$store.settings.settings.code_exec_same_file_write_ceiling" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">File-op window (seconds)</div>
              <div class="field-description">Window for counting same-file read/write operations. Larger values detect wider loops.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1" step="1" x-model.number="$store.settings.settings.code_exec_file_op_window_seconds" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Strategy-block TTL (seconds)</div>
              <div class="field-description">How long blocked strategies remain suppressed after a guard hit. Higher values enforce stronger strategy switching.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1" step="1" x-model.number="$store.settings.settings.code_exec_strategy_block_ttl_seconds" />
            </div>
          </div>

          <div class="subsection-title">Subordinate Guardrails</div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Subordinate max depth</div>
              <div class="field-description">Maximum nested subordinate call depth.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1" step="1" x-model.number="$store.settings.settings.subordinate_max_depth" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Subordinate max calls per turn</div>
              <div class="field-description">Limits subordinate invocations in one parent turn.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1" step="1" x-model.number="$store.settings.settings.subordinate_max_calls_per_turn" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Subordinate max runtime (seconds)</div>
              <div class="field-description">Maximum runtime allowed for subordinate execution.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1" step="1" x-model.number="$store.settings.settings.subordinate_max_runtime_seconds" />
            </div>
          </div>

          <div class="subsection-title">Queue / Backpressure</div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Queue max items</div>
              <div class="field-description">Maximum queued messages before policy is applied.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1" step="1" x-model.number="$store.settings.settings.queue_max_items" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Queue max total chars</div>
              <div class="field-description">Maximum total text chars held in queue.</div>
            </div>
            <div class="field-control">
              <input type="number" min="100" step="100" x-model.number="$store.settings.settings.queue_max_total_chars" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Queue drop policy</div>
              <div class="field-description">How queue handles overflow conditions.</div>
            </div>
            <div class="field-control">
              <select x-model="$store.settings.settings.queue_drop_policy">
                <option value="drop_oldest">drop_oldest</option>
                <option value="drop_newest">drop_newest</option>
                <option value="reject">reject</option>
              </select>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Queue send-all max items</div>
              <div class="field-description">Max items to aggregate in one send-all operation.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1" step="1" x-model.number="$store.settings.settings.queue_send_all_max_items" />
            </div>
          </div>

          <div class="subsection-title">Memory Load Limits</div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Memory load max records</div>
              <div class="field-description">Maximum memory entries loaded in one call.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1" step="1" x-model.number="$store.settings.settings.memory_load_limit_max" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Memory load query max chars</div>
              <div class="field-description">Maximum query text size accepted for memory loading.</div>
            </div>
            <div class="field-control">
              <input type="number" min="100" step="100" x-model.number="$store.settings.settings.memory_load_query_max_chars" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Memory load response max chars</div>
              <div class="field-description">Maximum response text size returned from memory load.</div>
            </div>
            <div class="field-control">
              <input type="number" min="100" step="100" x-model.number="$store.settings.settings.memory_load_response_max_chars" />
            </div>
          </div>

          <div class="subsection-title">History Compression</div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Compression target ratio</div>
              <div class="field-description">Target retained size of compressed history.</div>
            </div>
            <div class="field-control">
              <input type="range" min="0.4" max="1" step="0.01" x-model.number="$store.settings.settings.history_compression_target_ratio" />
              <span class="range-value" x-text="$store.settings.settings.history_compression_target_ratio"></span>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Current topic ratio</div>
              <div class="field-description">Portion reserved for most recent topic details.</div>
            </div>
            <div class="field-control">
              <input type="range" min="0" max="1" step="0.01" x-model.number="$store.settings.settings.history_current_topic_ratio" />
              <span class="range-value" x-text="$store.settings.settings.history_current_topic_ratio"></span>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Topic ratio</div>
              <div class="field-description">Portion reserved for topic-level summaries.</div>
            </div>
            <div class="field-control">
              <input type="range" min="0" max="1" step="0.01" x-model.number="$store.settings.settings.history_topic_ratio" />
              <span class="range-value" x-text="$store.settings.settings.history_topic_ratio"></span>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Bulk ratio</div>
              <div class="field-description">Portion reserved for coarse bulk history summaries.</div>
            </div>
            <div class="field-control">
              <input type="range" min="0" max="1" step="0.01" x-model.number="$store.settings.settings.history_bulk_ratio" />
              <span class="range-value" x-text="$store.settings.settings.history_bulk_ratio"></span>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Attention current ratio</div>
              <div class="field-description">Weight of current context for compression decisions.</div>
            </div>
            <div class="field-control">
              <input type="range" min="0" max="1" step="0.01" x-model.number="$store.settings.settings.history_attention_current_ratio" />
              <span class="range-value" x-text="$store.settings.settings.history_attention_current_ratio"></span>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Attention past ratio</div>
              <div class="field-description">Weight of older context for compression decisions.</div>
            </div>
            <div class="field-control">
              <input type="range" min="0" max="1" step="0.01" x-model.number="$store.settings.settings.history_attention_past_ratio" />
              <span class="range-value" x-text="$store.settings.settings.history_attention_past_ratio"></span>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Compression max passes</div>
              <div class="field-description">Maximum number of compression passes per cycle.</div>
            </div>
            <div class="field-control">
              <input type="number" min="0" step="1" x-model.number="$store.settings.settings.history_compress_max_passes" />
            </div>
          </div>

          <div class="subsection-title">Runtime Budgets</div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Turn budget (seconds)</div>
              <div class="field-description">Optional per-turn runtime budget (0 disables).</div>
            </div>
            <div class="field-control">
              <input type="number" min="0" step="1" x-model.number="$store.settings.settings.runtime_turn_budget_seconds" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Task budget (seconds)</div>
              <div class="field-description">Optional task runtime budget (0 disables).</div>
            </div>
            <div class="field-control">
              <input type="number" min="0" step="1" x-model.number="$store.settings.settings.runtime_task_budget_seconds" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Subordinate budget (seconds)</div>
              <div class="field-description">Optional subordinate runtime budget (0 disables).</div>
            </div>
            <div class="field-control">
              <input type="number" min="0" step="1" x-model.number="$store.settings.settings.runtime_subordinate_budget_seconds" />
            </div>
          </div>

          <div class="subsection-title">Model Call Parameters</div>

          <div class="field field-full">
            <div class="field-label">
              <div class="field-title">Chat model kwargs</div>
              <div class="field-description">Extra parameters passed to chat model calls (KEY=VALUE lines).</div>
            </div>
            <div class="field-control">
              <textarea rows="4" x-model="$store.settings.settings.chat_model_kwargs"></textarea>
            </div>
          </div>

          <div class="field field-full">
            <div class="field-label">
              <div class="field-title">LiteLLM global kwargs</div>
              <div class="field-description">Global call parameters applied across providers (timeouts, retries, etc.).</div>
            </div>
            <div class="field-control">
              <textarea rows="4" x-model="$store.settings.settings.litellm_global_kwargs"></textarea>
            </div>
          </div>
        </div>
      </template>
    </div>
  </body>
</html>
